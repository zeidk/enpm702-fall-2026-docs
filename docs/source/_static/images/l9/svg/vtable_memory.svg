<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1012" viewBox="0 0 1740 1012" version="1.1" id="vtable_memory">
  <title>Each object's hidden pointer leads to its class's vtable, and each entry to a method</title>
  <desc>Three columns. On the left, two blue Stack boxes, one above the other. The upper one, under the name tag robotaxi, holds a Vehicle part with three rows: (hidden pointer), max_speed_ 13.4 and speed_ 0.0, then a RoboTaxi part with one gray row, (its own members). The lower one, under the name tag taxi, holds the same Vehicle part, then a Taxi part with one row, driver_name_ "Ana". In the middle, a slate box headed vtables holds two tables, RoboTaxi's vtable and Taxi's vtable, each with two entries, destructor and drive. A blue arrow tagged 1 runs from robotaxi's hidden pointer to RoboTaxi's vtable, and another from taxi's hidden pointer to Taxi's vtable. On the right, a slate box headed Code holds four boxes: RoboTaxi::~RoboTaxi, RoboTaxi::drive, Taxi::~Taxi and Taxi::drive. A slate arrow runs from each entry to the code of the same class; the one from RoboTaxi's drive entry to RoboTaxi::drive is tagged 2.</desc>
