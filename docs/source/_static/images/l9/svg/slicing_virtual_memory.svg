  <title>Vehicle copy{taxi}; with a virtual drive: the copy has its own hidden pointer</title>
  <desc>Two blue Stack boxes side by side. On the left, under the name tag taxi, one object in two parts. The first part, captioned Vehicle part, has three rows: (hidden pointer) Taxi's vtable, then max_speed_ 13.4 and speed_ 0.0, each marked with a minus sign for private. The second part, captioned Taxi part, has one row: driver_name_ "Ana", marked private, with tag 2 beside it. A measuring line under taxi reads 56 bytes. On the right, under the name tag copy, one part, captioned Vehicle part, with three rows: (hidden pointer) Vehicle's vtable, with tag 3 beside it, then max_speed_ 13.4 and speed_ 0.0. A measuring line under copy reads 24 bytes. A blue arrow tagged 1 runs from the Vehicle part of taxi to the Vehicle part of copy.</desc>
