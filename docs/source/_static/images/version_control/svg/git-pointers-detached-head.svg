<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CA4027"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .mono{font-family:"DejaVu Sans Mono",monospace;font-weight:bold}
      .lbl {font-family:"DejaVu Sans Mono",monospace;font-size:19px;fill:#5E5D60}
      .cap {font-family:"DejaVu Sans Mono",monospace;font-size:23px;font-weight:bold;fill:#5E5D60}
      .ptr {stroke:#CA4027;stroke-width:5;marker-end:url(#ar)}
      .par {stroke:#111111;stroke-width:4;marker-end:url(#ak)}
      .note{font-family:"DejaVu Sans Mono",monospace;font-size:21px;font-weight:bold}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- ============ on a branch ============ -->
  <text class="cap" x="30" y="52">on a branch</text>
  <circle cx="120" cy="175" r="48" fill="#C6C6C6" stroke="#111111" stroke-width="5"/>
  <text class="mono" x="120" y="189" font-size="40" text-anchor="middle">A</text>
  <circle cx="300" cy="175" r="48" fill="#C6C6C6" stroke="#111111" stroke-width="5"/>
  <text class="mono" x="300" y="189" font-size="40" text-anchor="middle">B</text>
  <line class="par" x1="252" y1="175" x2="177" y2="175"/>

  <text class="lbl" x="585" y="108" text-anchor="middle">.git/refs/heads/main</text>
  <rect x="450" y="130" width="270" height="92" rx="11" fill="#EADCF0" stroke="#8F46AD" stroke-width="5"/>
  <text class="mono" x="585" y="184" font-size="23" text-anchor="middle">8dbdc321...</text>

  <text class="lbl" x="980" y="108" text-anchor="middle">.git/HEAD</text>
  <rect x="830" y="130" width="300" height="92" rx="11" fill="#D6E9F8" stroke="#2980B9" stroke-width="5"/>
  <text class="mono" x="980" y="184" font-size="20" text-anchor="middle">ref: refs/heads/main</text>

  <line class="ptr" x1="450" y1="176" x2="356" y2="176"/>
  <line class="ptr" x1="830" y1="176" x2="728" y2="176"/>

  <line x1="30" y1="300" x2="1170" y2="300" stroke="#C8C8C8" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- ============ detached ============ -->
  <text class="cap" x="30" y="356">detached HEAD</text>
  <circle cx="120" cy="478" r="48" fill="#C6C6C6" stroke="#111111" stroke-width="5"/>
  <text class="mono" x="120" y="492" font-size="40" text-anchor="middle">A</text>
  <circle cx="300" cy="478" r="48" fill="#C6C6C6" stroke="#111111" stroke-width="5"/>
  <text class="mono" x="300" y="492" font-size="40" text-anchor="middle">B</text>
  <line class="par" x1="252" y1="478" x2="177" y2="478"/>

  <text class="lbl" x="585" y="411" text-anchor="middle">.git/refs/heads/main</text>
  <rect x="450" y="433" width="270" height="92" rx="11" fill="#EADCF0" stroke="#8F46AD" stroke-width="5"/>
  <text class="mono" x="585" y="487" font-size="23" text-anchor="middle">8dbdc321...</text>

  <text class="lbl" x="980" y="411" text-anchor="middle">.git/HEAD</text>
  <rect x="830" y="433" width="300" height="92" rx="11" fill="#D6E9F8" stroke="#2980B9" stroke-width="6"/>
  <text class="mono" x="980" y="487" font-size="20" text-anchor="middle">a1b2c3d4e5f6...</text>
  <text class="note" x="980" y="562" text-anchor="middle" fill="#CA4027">a hash, not a branch</text>

  <line class="ptr" x1="450" y1="479" x2="356" y2="479"/>
  <!-- HEAD points straight past main, down and across to commit A -->
  <path class="ptr" d="M 830 479 L 790 479 L 790 590 L 120 590 L 120 532" fill="none"/>
</svg>
