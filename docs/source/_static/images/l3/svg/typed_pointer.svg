<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="920" viewBox="0 0 1300 920" version="1.1" id="typed_pointer">
  <title>Pointer size against pointee size</title>
  <desc>Three rows, each showing a pointer and the bytes it reads. In every row a blue stack box holds the same address 0x…a00 and is marked sizeof(p) == 8. An arrow runs from it to the same strip of eight bytes, holding the hex values 41 through 48. The bytes the dereference reads are tinted teal: one byte for char* status_ptr, giving the character A; four for int* altitude_ptr, giving 1145258561; and eight for double* voltage_ptr, giving 1.58e+40.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="1300" height="920" fill="#ffffff"/>
  <text x="650.0" y="62" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#1b1b1b" text-anchor="middle">every pointer is 8 bytes, whatever it points at</text>
  <text x="650.0" y="98" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#555555" text-anchor="middle">the type decides what the dereference reads, not how big the pointer is</text>
  <rect x="130" y="170" width="290" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="128.75" y="168.75" width="292.5" height="44" fill="#2f6fb5"/>
