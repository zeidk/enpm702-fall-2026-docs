  <text x="650.0" y="800" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1b1b1b" text-anchor="middle">sizeof(p) is the pointer. sizeof(*p) is the object it points at.</text>
  <text x="650.0" y="834" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#555555" text-anchor="middle">char* may always read the raw bytes. int* and double* need reinterpret_cast,</text>
  <text x="650.0" y="862" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#555555" text-anchor="middle">and only work if an object of that type really lives there.</text>
