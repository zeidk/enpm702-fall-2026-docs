  <text x="275.0" y="261.1" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x…a00</text>
  <text x="275.0" y="154" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="middle">char* status_ptr</text>
  <text x="275.0" y="320" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="normal" fill="#555555" text-anchor="middle">sizeof(status_ptr) == 8</text>
