<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" version="1.1" id="reference_memory">
  <title>A reference in the language, and in the generated code</title>
  <desc>Two panels. On the left, what the language says: a single stack box holding 120 with two names above it, altitude_m and alt, joined by a brace, and the notes &amp;alt is &amp;altitude_m and sizeof(alt) is sizeof(int). On the right, what GCC emitted: in a Debug build at -O0 an unnamed greyed-out eight-byte stack slot holds the address 0x7ffd…00c, exactly like an int* const; in a Release build at -O2 there is no slot at all, drawn as an empty dashed box with a cross through it.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="1440" height="620" fill="#ffffff"/>
  <line x1="700" y1="50" x2="700" y2="560" stroke="#ececec" stroke-width="2"/>
  <text x="350" y="74" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="27" font-weight="normal" fill="#555555" text-anchor="middle">what the language says</text>
  <text x="1070" y="74" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="27" font-weight="normal" fill="#555555" text-anchor="middle">what GCC actually emitted</text>
  <rect x="230.0" y="210" width="240" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="228.75" y="208.75" width="242.5" height="44" fill="#2f6fb5"/>
  <text x="350.0" y="241" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="350.0" y="304.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">120</text>
  <text x="258.0" y="148" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1b1b1b" text-anchor="middle">altitude_m</text>
  <text x="442.0" y="148" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f7a6c" text-anchor="middle">alt</text>
  <path d="M 195.0,172 q 0,22 14,22 L 336.0,194 q 14,0 14,14 q 0,-14 14,-14 L 491.0,194 q 14,0 14,-22" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="350" y="378" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="23" font-weight="normal" fill="#1b1b1b" text-anchor="middle">&amp;alt is &amp;altitude_m</text>
  <text x="350" y="412" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="23" font-weight="normal" fill="#1b1b1b" text-anchor="middle">sizeof(alt) is sizeof(int)</text>
  <text x="350" y="450" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#8a8a8a" text-anchor="middle">one object; the second name costs nothing</text>
  <text x="790" y="212" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="normal" fill="#1b1b1b" text-anchor="start">Debug  -O0</text>
  <rect x="1010" y="150" width="250" height="120" fill="#ececec" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="1008.75" y="148.75" width="252.5" height="44" fill="#9a9a9a"/>
  <text x="1135.0" y="181" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Stack (hidden)</text>
  <text x="1135.0" y="241.0" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="bold" fill="#555555" text-anchor="middle">0x7ffd…00c</text>
  <text x="1135.0" y="304" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#8a8a8a" text-anchor="middle">an unnamed 8-byte slot holding the address</text>
  <text x="1135.0" y="332" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#8a8a8a" text-anchor="middle">of altitude_m, exactly like an int* const</text>
  <text x="790" y="452" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="normal" fill="#1b1b1b" text-anchor="start">Release  -O2</text>
  <rect x="1010" y="390" width="250" height="120" fill="#ffffff" stroke="#d8d8d8" stroke-width="2.5" stroke-dasharray="10 8"/>
  <path d="M 1119.6,434.6 l 30.800000000000004,30.800000000000004 M 1150.4,434.6 l -30.800000000000004,30.800000000000004" fill="none" stroke="#c0392b" stroke-width="6.6000000000000005" stroke-linecap="round"/>
  <text x="1135.0" y="544" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#8a8a8a" text-anchor="middle">no slot at all: every use of alt</text>
  <text x="1135.0" y="572" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#8a8a8a" text-anchor="middle">was compiled into a use of altitude_m</text>
</svg>
