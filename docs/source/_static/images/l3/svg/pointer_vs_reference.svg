<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" version="1.1" id="pointer_vs_reference">
  <title>A pointer is another object; a reference is another name</title>
  <desc>On the left, int* altitude_ptr{&amp;altitude_m}; draws two stack boxes joined by an arrow: altitude_ptr holds the address of altitude_m, which holds 120. On the right, int&amp; alt{altitude_m}; draws a single stack box holding 120 with two names above it, altitude_m and alt, joined to the box by a brace.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="1440" height="520" fill="#ffffff"/>
  <line x1="720" y1="40" x2="720" y2="500" stroke="#ececec" stroke-width="2"/>
  <text x="360.0" y="78" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">int* altitude_ptr{&amp;altitude_m};</text>
  <text x="1080.0" y="78" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">int&amp; alt{altitude_m};</text>
  <rect x="70" y="220" width="220" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="68.75" y="218.75" width="222.5" height="44" fill="#2f6fb5"/>
  <text x="180.0" y="251" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="180.0" y="309.0" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x7ffd…a04</text>
  <text x="180.0" y="204" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">altitude_ptr</text>
  <rect x="430" y="220" width="220" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="428.75" y="218.75" width="222.5" height="44" fill="#2f6fb5"/>
  <text x="540.0" y="251" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="540.0" y="314.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">120</text>
  <text x="540.0" y="204" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">altitude_m</text>
  <line x1="302" y1="302.0" x2="418" y2="302.0" stroke="#2f6fb5" stroke-width="4.5" marker-end="url(#a-2f6fb5)"/>
  <text x="360.0" y="430" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="middle">two objects: altitude_ptr holds the address</text>
  <text x="360.0" y="458" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="middle">of altitude_m, and *altitude_ptr reaches it</text>
  <rect x="970.0" y="220" width="220" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="968.75" y="218.75" width="222.5" height="44" fill="#2f6fb5"/>
  <text x="1080.0" y="251" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="1080.0" y="314.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">120</text>
  <text x="994.0" y="158" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1b1b1b" text-anchor="middle">altitude_m</text>
  <text x="1166.0" y="158" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f7a6c" text-anchor="middle">alt</text>
  <path d="M 930.0,182 q 0,22 14,22 L 1066.0,204 q 14,0 14,14 q 0,-14 14,-14 L 1216.0,204 q 14,0 14,-22" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="1080.0" y="430" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="middle">one object with two names: alt is</text>
  <text x="1080.0" y="458" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="middle">altitude_m, and nothing else, for ever</text>
</svg>
