<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" version="1.1" id="pointee_location">
  <title>A pointer can point into the stack or into the heap</title>
  <desc>Two rows. In the top row, int altitude_m{120}; int* altitude_ptr{&amp;altitude_m}; draws a stack pointer box with a blue arrow to a named stack box holding 120. In the bottom row, int* battery_pct{new int{88}}; draws the same pointer with a red arrow to an unnamed heap box holding 88.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="60" y="196" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="25" font-weight="normal" fill="#1b1b1b" text-anchor="start">int altitude_m{120};</text>
  <text x="60" y="236" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="25" font-weight="normal" fill="#1b1b1b" text-anchor="start">int* altitude_ptr{&amp;altitude_m};</text>
  <rect x="560" y="120" width="230" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="558.75" y="118.75" width="232.5" height="44" fill="#2f6fb5"/>
  <text x="675.0" y="151" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="675.0" y="209.7" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x7ffd…a04</text>
  <text x="675.0" y="104" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">altitude_ptr</text>
  <rect x="1030" y="120" width="230" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="1028.75" y="118.75" width="232.5" height="44" fill="#2f6fb5"/>
  <text x="1145.0" y="151" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="1145.0" y="214.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">120</text>
  <text x="1145.0" y="104" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">altitude_m</text>
  <text x="1145.0" y="272" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="21" font-weight="normal" fill="#555555" text-anchor="middle">0x7ffd…a04</text>
  <line x1="802" y1="202.0" x2="1018" y2="202.0" stroke="#2f6fb5" stroke-width="4.5" marker-end="url(#a-2f6fb5)"/>
  <text x="760.0" y="318" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="middle">the object has a name and a scope: it dies at the end of it</text>
  <text x="60" y="516" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="25" font-weight="normal" fill="#1b1b1b" text-anchor="start">int* battery_pct{new int{88}};</text>
  <rect x="560" y="440" width="230" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="558.75" y="438.75" width="232.5" height="44" fill="#2f6fb5"/>
  <text x="675.0" y="471" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="675.0" y="529.7" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x5591…2b0</text>
  <text x="675.0" y="424" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">battery_pct</text>
  <rect x="1030" y="440" width="230" height="120" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="1028.75" y="438.75" width="232.5" height="44" fill="#c0392b"/>
  <text x="1145.0" y="471" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Heap</text>
  <text x="1145.0" y="534.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">88</text>
  <text x="1145.0" y="592" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="21" font-weight="normal" fill="#555555" text-anchor="middle">0x5591…2b0</text>
  <text x="1145.0" y="424" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#8a8a8a" text-anchor="middle">(no name)</text>
  <line x1="802" y1="522.0" x2="1018" y2="522.0" stroke="#c0392b" stroke-width="4.5" marker-end="url(#a-c0392b)"/>
  <text x="760.0" y="638" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="middle">the object has no name and no scope: it lives until delete</text>
  <line x1="60" y1="390" x2="1340" y2="390" stroke="#ececec" stroke-width="2"/>
</svg>
