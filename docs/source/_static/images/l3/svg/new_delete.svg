<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" version="1.1" id="new_delete">
  <title>new, delete, and the state of the pointer after each</title>
  <desc>Three numbered stages. One: int* battery_pct{new int{88}}; a stack box named battery_pct holds a heap address and a red arrow points to a live heap box holding 88. Two: delete battery_pct; the heap box is greyed and labelled freed, and the arrow is dashed and labelled dangling. Three: battery_pct = nullptr; the pointer holds nullptr and there is no arrow.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="1440" height="1000" fill="#ffffff"/>
  <circle cx="70" cy="90" r="24" fill="#555555"/>
  <text x="70" y="100" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="120" y="100" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="28" font-weight="normal" fill="#1b1b1b" text-anchor="start">int* battery_pct{new int{88}};</text>
  <rect x="560" y="160" width="280" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="558.75" y="158.75" width="282.5" height="44" fill="#2f6fb5"/>
  <text x="700.0" y="191" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="700.0" y="250.4" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x5591…2b0</text>
  <text x="700.0" y="144" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">battery_pct</text>
  <rect x="1030" y="160" width="280" height="120" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="1028.75" y="158.75" width="282.5" height="44" fill="#c0392b"/>
  <text x="1170.0" y="191" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Heap</text>
  <text x="1170.0" y="254.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">88</text>
  <line x1="852" y1="242.0" x2="1018" y2="242.0" stroke="#c0392b" stroke-width="4.5" marker-end="url(#a-c0392b)"/>
  <text x="120" y="316" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="start">new returns the address of an unnamed object on the heap</text>
  <circle cx="70" cy="390" r="24" fill="#555555"/>
  <text x="70" y="400" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="120" y="400" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="28" font-weight="normal" fill="#1b1b1b" text-anchor="start">delete battery_pct;</text>
  <rect x="560" y="460" width="280" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="558.75" y="458.75" width="282.5" height="44" fill="#2f6fb5"/>
  <text x="700.0" y="491" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="700.0" y="550.4" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x5591…2b0</text>
  <text x="700.0" y="444" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">battery_pct</text>
  <rect x="1030" y="460" width="280" height="120" fill="#ececec" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="1028.75" y="458.75" width="282.5" height="44" fill="#9a9a9a"/>
  <text x="1170.0" y="491" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Heap (freed)</text>
  <text x="1170.0" y="554.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#8a8a8a" text-anchor="middle">88</text>
  <line x1="852" y1="542.0" x2="1018" y2="542.0" stroke="#9a9a9a" stroke-width="4.5" marker-end="url(#a-9a9a9a)" stroke-dasharray="12 9"/>
  <text x="935.0" y="522.0" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#c0392b" text-anchor="middle">dangling</text>
  <text x="120" y="616" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="start">the storage is returned, but battery_pct still holds the address, so it dangles</text>
  <circle cx="70" cy="690" r="24" fill="#555555"/>
  <text x="70" y="700" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="120" y="700" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="28" font-weight="normal" fill="#1b1b1b" text-anchor="start">battery_pct = nullptr;</text>
  <rect x="560" y="760" width="280" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="558.75" y="758.75" width="282.5" height="44" fill="#2f6fb5"/>
  <text x="700.0" y="791" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="700.0" y="850.4" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="bold" fill="#1b1b1b" text-anchor="middle">nullptr</text>
  <text x="700.0" y="744" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">battery_pct</text>
  <text x="1018" y="850.0" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#8a8a8a" text-anchor="start">no arrow: it points nowhere</text>
  <text x="120" y="916" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8a8a8a" text-anchor="start">now the pointer says, in a way you can test, that it owns nothing</text>
</svg>
