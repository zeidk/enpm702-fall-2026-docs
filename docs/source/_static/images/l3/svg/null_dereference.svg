<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" version="1.1" id="null_dereference">
  <title>A null dereference</title>
  <desc>A stack box named sensor holding nullptr, with a dashed arrow pointing down to an empty dashed circle containing a red cross: there is no object at the other end, so dereferencing the pointer is undefined behavior.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <rect x="255.0" y="120" width="250" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="253.75" y="118.75" width="252.5" height="44" fill="#2f6fb5"/>
  <text x="380.0" y="151" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="380.0" y="211.1" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#1b1b1b" text-anchor="middle">nullptr</text>
  <text x="380.0" y="104" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">sensor</text>
  <line x1="380.0" y1="250" x2="380.0" y2="330" stroke="#9a9a9a" stroke-width="4.5" marker-end="url(#a-9a9a9a)" stroke-dasharray="10 8"/>
  <circle cx="380.0" cy="400" r="62" fill="#ffffff" stroke="#9a9a9a" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M 363.2,383.2 l 33.6,33.6 M 396.8,383.2 l -33.6,33.6" fill="none" stroke="#c0392b" stroke-width="7.199999999999999" stroke-linecap="round"/>
  <text x="380.0" y="508" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="normal" fill="#c0392b" text-anchor="middle">*sensor is undefined behavior:</text>
  <text x="380.0" y="538" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#c0392b" text-anchor="middle">test the pointer before dereferencing it</text>
</svg>
