<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" version="1.1" id="memory_leak">
  <title>A memory leak</title>
  <desc>A greyed-out stack box named battery_pct, labelled Stack (gone) because its scope has ended, with a dashed arrow down to a live heap box holding 88. The arrow is crossed out: the block is still allocated and nothing points at it any more.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380.0" y="60" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="normal" fill="#555555" text-anchor="middle">} // scope ends here</text>
  <rect x="255.0" y="120" width="250" height="120" fill="#ececec" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="253.75" y="118.75" width="252.5" height="44" fill="#9a9a9a"/>
  <text x="380.0" y="151" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack (gone)</text>
  <text x="380.0" y="209.7" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#8a8a8a" text-anchor="middle">0x5591…2b0</text>
  <text x="380.0" y="104" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#8a8a8a" text-anchor="middle">battery_pct</text>
  <line x1="380.0" y1="250" x2="380.0" y2="330" stroke="#9a9a9a" stroke-width="4.5" marker-end="url(#a-9a9a9a)" stroke-dasharray="10 8"/>
  <path d="M 367.4,275.4 l 25.2,25.2 M 392.6,275.4 l -25.2,25.2" fill="none" stroke="#c0392b" stroke-width="5.4" stroke-linecap="round"/>
  <rect x="255.0" y="338" width="250" height="120" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="253.75" y="336.75" width="252.5" height="44" fill="#c0392b"/>
  <text x="380.0" y="369" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Heap</text>
  <text x="380.0" y="432.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b1b1b" text-anchor="middle">88</text>
  <text x="380.0" y="512" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#c0392b" text-anchor="middle">still allocated, and now unreachable for ever</text>
</svg>
