<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" version="1.1" id="double_delete">
  <title>A double delete</title>
  <desc>Two stack boxes, primary and backup, both holding the same heap address 0x5591…2b0, with dashed arrows converging on one greyed heap box labelled Heap (freed). Deleting through primary and then through backup frees the same block twice.</desc>
  <defs><marker id="a-2f6fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="a-555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker><marker id="a-7d8f1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f1c"/></marker><marker id="a-1f7a6c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6c"/></marker><marker id="a-9a9a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <rect x="90" y="120" width="200" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="88.75" y="118.75" width="202.5" height="44" fill="#2f6fb5"/>
  <text x="190.0" y="151" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="190.0" y="209.0" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x5591…2b0</text>
  <text x="190.0" y="104" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">primary</text>
  <rect x="470" y="120" width="200" height="120" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.5"/>
  <rect x="468.75" y="118.75" width="202.5" height="44" fill="#2f6fb5"/>
  <text x="570.0" y="151" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Stack</text>
  <text x="570.0" y="209.0" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="bold" fill="#1b1b1b" text-anchor="middle">0x5591…2b0</text>
  <text x="570.0" y="104" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b1b1b" text-anchor="middle">backup</text>
  <line x1="190.0" y1="250" x2="340.0" y2="330" stroke="#9a9a9a" stroke-width="4.5" marker-end="url(#a-9a9a9a)" stroke-dasharray="10 8"/>
  <line x1="570.0" y1="250" x2="420.0" y2="330" stroke="#9a9a9a" stroke-width="4.5" marker-end="url(#a-9a9a9a)" stroke-dasharray="10 8"/>
  <rect x="255.0" y="338" width="250" height="120" fill="#ececec" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="253.75" y="336.75" width="252.5" height="44" fill="#9a9a9a"/>
  <text x="380.0" y="369" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Heap (freed)</text>
  <text x="380.0" y="432.6" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#8a8a8a" text-anchor="middle">88</text>
  <text x="380.0" y="508" font-family="'Fira Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="normal" fill="#c0392b" text-anchor="middle">delete primary;   delete backup;</text>
  <text x="380.0" y="538" font-family="'Fira Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#c0392b" text-anchor="middle">the second one is undefined behavior</text>
</svg>
